<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach chat — redesigned</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f3ee}
a{color:#c53838}a:hover{color:#a82e2e}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f3ee; font-family: Figtree, sans-serif; color: #14171f; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e8e4db; background: #f5f3ee">
    <span style="width: 36px; height: 36px; border-radius: 999px; background: #0c2340; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="#e8b923"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg></span>
    <span style="flex-grow: 1; font-family: Outfit, sans-serif; font-size: 20px; font-weight: 700">Coach</span>
    <button aria-label="Chat options" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: none; color: #14171f; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
      <span style="font-size: 12px; font-weight: 700; color: #5b6270; background: #ebe7de; padding: 5px 10px; border-radius: 999px">Get stronger</span>
      <span style="font-size: 12px; font-weight: 700; color: #5b6270; background: #ebe7de; padding: 5px 10px; border-radius: 999px">4× · 60 min</span>
      <span style="font-size: 12px; font-weight: 700; color: #5b6270; background: #ebe7de; padding: 5px 10px; border-radius: 999px">Full gym</span>
      <span style="font-size: 12px; font-weight: 700; color: #5b6270; background: #ebe7de; padding: 5px 10px; border-radius: 999px">Brand new</span>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-end; max-width: 88%">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #0c2340; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="#e8b923"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg></span>
      <div style="background: #ffffff; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 15px; line-height: 1.4">Your plan is set. Want to change anything?</div>
    </div>

    <div style="align-self: flex-end; max-width: 75%; background: #0c2340; color: #ffffff; border-radius: 18px 18px 6px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.4">Can I do 3 days instead some weeks?</div>

    <div style="display: flex; gap: 8px; align-items: flex-end; max-width: 92%">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #0c2340; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="#e8b923"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="background: #ffffff; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 15px; line-height: 1.4">Sure. On busy weeks I’ll merge Saturday into the other days.</div>
        <div style="background: #ffffff; border: 1.5px solid #e8b923; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: Outfit, sans-serif; font-size: 16px; font-weight: 700">Flexible week</span><span style="font-size: 12px; font-weight: 800; color: #8a6700">PLAN CHANGE</span></div>
          <div style="font-size: 14px; color: #5b6270">3 or 4 days · longer sessions on 3-day weeks</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button style="height: 44px; border-radius: 999px; border: none; background: #c53838; color: #ffffff; font-size: 14px; font-weight: 800">Apply</button>
            <button style="height: 44px; border-radius: 999px; border: 1.5px solid #dcd8cf; background: #ffffff; color: #14171f; font-size: 14px; font-weight: 700">Not now</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 110px; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dcd8cf; background: #ffffff; color: #14171f; font-size: 13px; font-weight: 700">Swap an exercise</button>
      <button style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dcd8cf; background: #ffffff; color: #14171f; font-size: 13px; font-weight: 700">Something hurts</button>
      <button style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dcd8cf; background: #ffffff; color: #14171f; font-size: 13px; font-weight: 700">Short on time</button>
    </div>
    <div style="height: 52px; background: #ffffff; border-radius: 999px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 16px; box-shadow: 0 1px 3px rgba(12,35,64,0.1); position: relative">
      <label for="chat-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message Coach</label>
      <input id="chat-msg" placeholder="Ask Coach…" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: none; font-size: 15px; color: #14171f">
      <button aria-label="Talk to coach" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #0c2340; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11 C5 15 8 17 12 17 C16 17 19 15 19 11 M12 17 V21"></path></svg></button>
    </div>
  </div>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 72px; background: #ffffff; border-radius: 999px; box-shadow: 0 10px 30px rgba(12,35,64,0.16); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <button style="height: 56px; border: none; background: none; color: #5b6270; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"></path></svg>Home</button>
    <button style="height: 56px; border: none; background: none; color: #5b6270; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10 H20 M9 3 V7 M15 3 V7"></path></svg>Plan</button>
    <button aria-label="Scan" style="justify-self: center; width: 56px; height: 56px; border-radius: 999px; border: none; background: #c53838; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(224,78,78,0.35)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"></path></svg></button>
    <button style="height: 56px; border: none; background: none; color: #0c2340; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="#e8b923" stroke="#0c2340" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg>Coach</button>
    <button style="height: 56px; border: none; background: none; color: #5b6270; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20 C5 15 19 15 20 20"></path></svg>You</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
