<!doctype html>

<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0c2340}
a{color:#c53838}a:hover{color:#a82e2e}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0c2340; font-family: Figtree, sans-serif; color: #14171f; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 220px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center">
    <a href="Scan.dc.html" aria-label="Back" style="position: absolute; left: 20px; top: 52px; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.14); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6 L9 12 L15 18"></path></svg></a>
    <button aria-label="Save machine" style="position: absolute; right: 20px; top: 52px; width: 44px; height: 44px; border-radius: 999px; border: none; background: rgba(255,255,255,0.14); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4 H18 V21 L12 16 L6 21 Z"></path></svg></button>
    <div style="position: relative; width: 170px; height: 130px; margin-top: 40px; display: flex; align-items: center; justify-content: center">
      <svg width="140" height="112" viewBox="0 0 200 160" fill="none" stroke="#dbe2ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 150 L170 150"></path><path d="M60 150 L60 30 L140 30 L140 150"></path><rect x="84" y="50" width="32" height="48" rx="6"></rect><rect x="78" y="102" width="44" height="10" rx="4"></rect><path d="M100 112 L100 150"></path><path d="M60 72 L36 72 L36 84" stroke="#ff7a6e"></path><path d="M140 72 L164 72 L164 84" stroke="#ff7a6e"></path><rect x="150" y="96" width="18" height="46" rx="2"></rect></svg>
      <div style="position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-left: 4px solid #9ad63a; border-top: 4px solid #9ad63a"></div>
      <div style="position: absolute; right: 0; top: 0; width: 22px; height: 22px; border-right: 4px solid #9ad63a; border-top: 4px solid #9ad63a"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 22px; height: 22px; border-left: 4px solid #9ad63a; border-bottom: 4px solid #9ad63a"></div>
      <div style="position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; border-right: 4px solid #9ad63a; border-bottom: 4px solid #9ad63a"></div>
    </div>
  </div>

  <div style="flex-grow: 1; background: #f5f3ee; border-radius: 32px 32px 0 0; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 8px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #4f8000; background: #eef6e0; padding: 5px 10px; border-radius: 999px">BEGINNER FRIENDLY</span>
      </div>
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">Chest Press</h1>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 14px; font-weight: 800; color: #ffffff; background: #c53838; padding: 6px 12px; border-radius: 999px">Chest</span>
        <span style="font-size: 14px; font-weight: 600; border: 1.5px solid #dcd8cf; padding: 5px 12px; border-radius: 999px">Shoulders</span>
        <span style="font-size: 14px; font-weight: 600; border: 1.5px solid #dcd8cf; padding: 5px 12px; border-radius: 999px">Triceps</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 14px; align-items: baseline"><span style="font-family: Outfit, sans-serif; font-size: 22px; font-weight: 800; color: #c53838; width: 28px">01</span><span style="font-size: 15px; line-height: 1.4">Raise the seat until handles meet mid-chest.</span></div>
      <div style="display: flex; gap: 14px; align-items: baseline"><span style="font-family: Outfit, sans-serif; font-size: 22px; font-weight: 800; color: #c53838; width: 28px">02</span><span style="font-size: 15px; line-height: 1.4">Press out for 2 sec, back in for 3.</span></div>
      <div style="display: flex; gap: 14px; align-items: baseline"><span style="font-family: Outfit, sans-serif; font-size: 22px; font-weight: 800; color: #c53838; width: 28px">03</span><span style="font-size: 15px; line-height: 1.4">Stop just short of locking your elbows.</span></div>
    </div>

    <div style="background: #0c2340; color: #ffffff; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#e8b923"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg><span style="font-size: 14px; font-weight: 800">Ask Coach about this machine</span></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button style="height: 44px; text-align: left; padding: 0 14px; border-radius: 14px; border: none; background: rgba(255,255,255,0.1); color: #ffffff; font-size: 14px; font-weight: 600">What weight should I start with?</button>
        <button style="height: 44px; text-align: left; padding: 0 14px; border-radius: 14px; border: none; background: rgba(255,255,255,0.1); color: #ffffff; font-size: 14px; font-weight: 600">Easier option for my shoulder?</button>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; background: #f5f3ee; padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #5c3d00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3 L20 7 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V7 Z"></path><path d="M12 8 V13 M12 16 V16.5"></path></svg>Stop if you feel sharp pain in your shoulder.</div>
    <a href="Workout.dc.html" style="height: 56px; border-radius: 999px; background: #c53838; color: #ffffff; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center">Add to today’s workout</a>
  </div>
</div>
</x-dc>
