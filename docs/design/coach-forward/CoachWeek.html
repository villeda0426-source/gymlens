<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpotLift Coach weekly check-in — Coach Forward</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f3ee}
a{color:#c53838}a:hover{color:#a82e2e}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f3ee; font-family: Figtree, sans-serif; color: #14171f; position: relative; overflow: hidden">
  <div style="background: #0c2340; color: #ffffff; padding: 52px 20px 22px; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Coach.dc.html" aria-label="Back to coach chat" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6 L9 12 L15 18"></path></svg></a>
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #e8b923">WEEKLY CHECK-IN</span>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 14px; color: #b9c3d1; font-weight: 600">Week 3</div>
        <div style="font-family: Outfit, sans-serif; font-size: 54px; font-weight: 800; line-height: 0.9">3 of 4</div>
        <div style="font-size: 15px; color: #dbe2ea">workouts done. Nice week.</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; align-items: end; height: 70px; width: 130px">
        <div style="height: 44px; border-radius: 4px; background: #9ad63a"></div>
        <div style="height: 6px; border-radius: 4px; background: rgba(255,255,255,0.18)"></div>
        <div style="height: 56px; border-radius: 4px; background: #9ad63a"></div>
        <div style="height: 6px; border-radius: 4px; background: rgba(255,255,255,0.18)"></div>
        <div style="height: 6px; border-radius: 4px; background: rgba(255,255,255,0.18)"></div>
        <div style="height: 64px; border-radius: 4px; background: #9ad63a"></div>
        <div style="height: 6px; border-radius: 4px; background: rgba(255,255,255,0.18)"></div>
      </div>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #5b6270">WHAT I NOTICED</div>
      <div style="background: #ffffff; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 2px rgba(12,35,64,0.06)">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #eef6e0; color: #4f8000; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 L10 10 L14 14 L20 8 M15 8 H20 V13"></path></svg></span>
        <span style="font-size: 15px; line-height: 1.4">Leg press is up 10 kg since week 1.</span>
      </div>
      <div style="background: #ffffff; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 2px rgba(12,35,64,0.06)">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #faf1d9; color: #8a6700; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10 H20 M9 3 V7 M15 3 V7"></path></svg></span>
        <span style="font-size: 15px; line-height: 1.4">Friday sessions keep getting skipped.</span>
      </div>
    </div>

    <div style="background: #ffffff; border: 1.5px solid #e8b923; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="#e8b923"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg><span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 700">Changes for next week</span></div>
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.4">
        <div style="display: flex; gap: 10px"><span style="font-weight: 800; color: #8a6700">1</span><span>Move Friday’s workout to Saturday morning.</span></div>
        <div style="display: flex; gap: 10px"><span style="font-weight: 800; color: #8a6700">2</span><span>Add 2.5 kg to leg press.</span></div>
        <div style="display: flex; gap: 10px"><span style="font-weight: 800; color: #8a6700">3</span><span>Keep cable fly instead of chest press.</span></div>
      </div>
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px">
        <button style="height: 50px; border-radius: 999px; border: none; background: #c53838; color: #ffffff; font-size: 16px; font-weight: 800">Approve changes</button>
        <button style="height: 50px; border-radius: 999px; border: 1.5px solid #dcd8cf; background: #ffffff; color: #14171f; font-size: 15px; font-weight: 700">Edit</button>
      </div>
    </div>
  </div>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 72px; background: #ffffff; border-radius: 999px; box-shadow: 0 10px 30px rgba(12,35,64,0.16); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="Main.dc.html" style="height: 56px; text-decoration: none; color: #5b6270; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"></path></svg>Home</a>
    <a href="Main.dc.html" style="height: 56px; text-decoration: none; color: #5b6270; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10 H20 M9 3 V7 M15 3 V7"></path></svg>Plan</a>
    <a href="Scan.dc.html" aria-label="Scan" style="justify-self: center; width: 56px; height: 56px; border-radius: 999px; background: #c53838; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(224,78,78,0.35)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"></path></svg></a>
    <a href="Coach.dc.html" style="height: 56px; text-decoration: none; color: #0c2340; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="#e8b923" stroke="#0c2340" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"></path></svg>Coach</a>
    <a href="Main.dc.html" style="height: 56px; text-decoration: none; color: #5b6270; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20 C5 15 19 15 20 20"></path></svg>You</a>
  </nav>
</div>
</x-dc>

</html>
